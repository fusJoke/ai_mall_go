<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI Go Mall · C 端 uni-h5 原型图</title>
<style>
:root{
  --bg:#0b0d12; --surface:#161a22; --surface-2:#1d222c; --line:rgba(255,255,255,.09);
  --text:#e9ecf2; --muted:#8b94a6; --dim:#5d6678;
  --gold:#f5b544; --gold-2:#ffd479; --gold-dim:rgba(245,181,68,.14);
  --ssr:#ffd479; --sr:#b98cff; --r:#5aa9ff; --n:#8b94a6;
  --danger:#ff6b6b; --ok:#4ecb8f;
}
*{box-sizing:border-box;margin:0;padding:0}
body{
  background:var(--bg); color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  -webkit-font-smoothing:antialiased; padding:40px 24px 72px;
}
.doc-head{max-width:1400px;margin:0 auto 40px}
.doc-head h1{font-size:24px;font-weight:600;letter-spacing:.5px;margin-bottom:8px}
.doc-head p{color:var(--muted);font-size:14px;line-height:1.75;max-width:820px}
.doc-head .tags{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}
.tag{font-size:12px;padding:4px 12px;border-radius:999px;background:var(--gold-dim);color:var(--gold-2);border:1px solid rgba(245,181,68,.25)}
.tag.g{background:rgba(255,255,255,.05);color:var(--muted);border-color:var(--line)}

.gallery{max-width:1400px;margin:0 auto;display:grid;gap:36px 32px;grid-template-columns:repeat(auto-fill,minmax(320px,1fr))}
figure{margin:0}
figcaption{margin-top:14px;font-size:13px;color:var(--muted);line-height:1.6}
figcaption b{color:var(--gold-2);font-weight:600;display:block;font-size:14px;margin-bottom:3px}
figcaption span{color:var(--dim);font-size:12px}

.phone{
  width:100%;aspect-ratio:375/812;border-radius:30px;overflow:hidden;position:relative;
  background:var(--bg);border:1px solid rgba(255,255,255,.12);
  box-shadow:0 18px 48px rgba(0,0,0,.6),0 0 0 6px rgba(255,255,255,.03);
  display:flex;flex-direction:column;
}
.statusbar{
  height:34px;flex:0 0 34px;display:flex;align-items:center;justify-content:space-between;
  padding:0 18px;font-size:11px;color:var(--text);letter-spacing:.3px;
}
.statusbar .icons{display:flex;gap:4px;align-items:center}
.sig{display:flex;gap:1.5px;align-items:flex-end}
.sig i{width:2.5px;background:var(--text);border-radius:1px;display:block}
.sig i:nth-child(1){height:4px}.sig i:nth-child(2){height:6px}.sig i:nth-child(3){height:8px}.sig i:nth-child(4){height:10px}
.bat{width:18px;height:9px;border:1px solid rgba(255,255,255,.5);border-radius:2px;position:relative}
.bat::after{content:"";position:absolute;left:1.5px;top:1.5px;bottom:1.5px;width:9px;background:var(--text);border-radius:1px}

.navbar{
  height:44px;flex:0 0 44px;display:flex;align-items:center;padding:0 16px;gap:10px;
  border-bottom:1px solid var(--line);
}
.navbar .title{font-size:15px;font-weight:600;flex:1;text-align:center}
.navbar .back{width:18px;height:18px;border-left:1.5px solid var(--text);border-bottom:1.5px solid var(--text);transform:rotate(45deg);margin-left:4px;opacity:.85}
.navbar .ph{width:18px}

.body{flex:1;overflow:hidden;position:relative}
.scroll{height:100%;overflow:hidden;padding:0 14px}

.tabbar{
  flex:0 0 54px;display:flex;border-top:1px solid var(--line);background:rgba(13,15,20,.96);
  padding-bottom:6px;
}
.tabbar div{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:10px;color:var(--dim)}
.tabbar div.on{color:var(--gold)}
.tab-ico{width:19px;height:19px;border:1.5px solid currentColor;border-radius:5px;position:relative}
.tabbar div:nth-child(1) .tab-ico{border-radius:5px 5px 2px 2px}
.tabbar div:nth-child(2) .tab-ico{border-radius:3px}
.tabbar div:nth-child(2) .tab-ico::after{content:"";position:absolute;left:3px;right:3px;top:4px;height:1.5px;background:currentColor;box-shadow:0 4px 0 currentColor}
.tabbar div:nth-child(3) .tab-ico{border-radius:50% 50% 40% 40%}

.art{position:relative;overflow:hidden;background:#20252f}
.art::after{content:"";position:absolute;inset:0;background:linear-gradient(115deg,rgba(255,255,255,.14) 0%,rgba(255,255,255,0) 42%,rgba(255,255,255,.07) 100%)}
.a1{background:linear-gradient(150deg,#3c2a12,#6b4a18 45%,#2a1d0d)}
.a2{background:linear-gradient(150deg,#1b2a4a,#2f4f86 45%,#131d31)}
.a3{background:linear-gradient(150deg,#3a1f42,#63346e 45%,#241429)}
.a4{background:linear-gradient(150deg,#12362e,#1d5f4d 45%,#0c231e)}
.a5{background:linear-gradient(150deg,#3b2420,#6d3f34 45%,#241512)}
.a6{background:linear-gradient(150deg,#243040,#3c5068 45%,#161d26)}

.chiprar{position:absolute;top:8px;left:8px;z-index:2;font-size:9px;font-weight:700;letter-spacing:.6px;padding:2px 7px;border-radius:4px}
.c-ssr{background:linear-gradient(135deg,#ffd479,#e09b2d);color:#3a2600}
.c-sr{background:linear-gradient(135deg,#c9a6ff,#8f5cf0);color:#1e0b3d}
.c-r{background:linear-gradient(135deg,#8dc6ff,#3d84e0);color:#04203f}
.c-n{background:linear-gradient(135deg,#aab2c0,#6d7684);color:#12161d}

.srch{height:34px;border-radius:17px;background:var(--surface-2);display:flex;align-items:center;padding:0 12px;gap:8px;font-size:12px;color:var(--dim);margin:12px 0}
.srch::before{content:"";width:11px;height:11px;border:1.5px solid var(--dim);border-radius:50%;flex:0 0 auto}
.cats{display:flex;gap:7px;margin-bottom:13px;overflow:hidden}
.cats span{font-size:11px;padding:5px 12px;border-radius:999px;background:var(--surface-2);color:var(--muted);white-space:nowrap}
.cats span.on{background:var(--gold-dim);color:var(--gold-2);border:1px solid rgba(245,181,68,.35)}

.banner{height:82px;border-radius:12px;background:linear-gradient(115deg,#4a3110,#8a5f18 55%,#2a1c08);position:relative;overflow:hidden;margin-bottom:16px;display:flex;flex-direction:column;justify-content:center;padding:0 16px}
.banner::after{content:"";position:absolute;right:-20px;top:-30px;width:120px;height:140px;border-radius:50%;background:radial-gradient(circle,rgba(255,212,121,.35),transparent 68%)}
.banner h4{font-size:14px;font-weight:600;color:#ffe4ad;position:relative;z-index:1}
.banner p{font-size:10px;color:rgba(255,228,173,.72);margin-top:3px;position:relative;z-index:1}

.sec{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.sec h3{font-size:14px;font-weight:600}
.sec h3::before{content:"";display:inline-block;width:3px;height:12px;background:var(--gold);border-radius:2px;margin-right:7px;vertical-align:-1px}
.sec a{font-size:11px;color:var(--dim);text-decoration:none}

.grid2{display:grid;grid-template-columns:1fr 1fr;gap:11px}
.pcard{background:var(--surface);border:1px solid var(--line);border-radius:11px;overflow:hidden}
.pcard .art{height:96px}
.pcard .meta{padding:8px 9px 10px}
.pcard .nm{font-size:12px;font-weight:600;line-height:1.35;height:32px;overflow:hidden}
.pcard .sp{font-size:9.5px;color:var(--dim);margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pcard .rar{font-size:9px;color:var(--muted);margin-top:3px}
.prow{display:flex;align-items:baseline;gap:5px;margin-top:7px}
.prow .p{font-size:14px;font-weight:700;color:var(--gold-2)}
.prow .o{font-size:9.5px;color:var(--dim);text-decoration:line-through}

.hero{height:220px;position:relative;margin:0 -14px}
.hero .art{height:100%}
.hero .veil{position:absolute;inset:0;background:linear-gradient(to bottom,transparent 40%,rgba(11,13,18,.85) 82%,var(--bg))}
.hero .stockbar{position:absolute;left:14px;right:14px;bottom:12px;z-index:2}
.stocklabel{display:flex;justify-content:space-between;font-size:10px;color:var(--muted);margin-bottom:5px}
.stocklabel b{color:var(--gold-2);font-weight:600}
.bar{height:4px;border-radius:2px;background:rgba(255,255,255,.12);overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--gold),var(--gold-2));border-radius:2px}

.dtitle{font-size:17px;font-weight:600;line-height:1.4;margin:2px 0 8px}
.dsup{display:flex;align-items:center;gap:8px;margin-bottom:12px}
.dsup .av{width:22px;height:22px;border-radius:50%;background:linear-gradient(135deg,#4a5a72,#2a3444);border:1px solid var(--line)}
.dsup .nm{font-size:11.5px;color:var(--muted);flex:1}
.dsup .fo{font-size:10px;padding:3px 11px;border-radius:999px;border:1px solid rgba(245,181,68,.4);color:var(--gold);background:var(--gold-dim)}

.pricebox{background:linear-gradient(100deg,rgba(245,181,68,.12),rgba(245,181,68,.03));border:1px solid rgba(245,181,68,.22);border-radius:11px;padding:11px 13px;margin-bottom:12px}
.pricebox .r1{display:flex;align-items:baseline;gap:8px}
.pricebox .now{font-size:23px;font-weight:700;color:var(--gold-2);letter-spacing:-.5px}
.pricebox .old{font-size:11px;color:var(--dim);text-decoration:line-through}
.pricebox .off{font-size:10px;padding:2px 7px;border-radius:4px;background:rgba(255,107,107,.16);color:#ff8f8f;font-weight:600}
.pricebox .r2{display:flex;justify-content:space-between;margin-top:7px;font-size:10.5px;color:var(--muted)}
.pricebox .r2 b{color:#ffb4b4;font-weight:600}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:11px;padding:12px 13px;margin-bottom:12px}
.panel h4{font-size:12.5px;font-weight:600;margin-bottom:10px;display:flex;align-items:center;gap:6px}
.panel h4::before{content:"";width:3px;height:11px;background:var(--gold);border-radius:2px}
.panel h4 em{font-style:normal;font-size:9.5px;color:var(--dim);font-weight:400;margin-left:auto}

table.pr{width:100%;border-collapse:collapse;font-size:11px}
table.pr th{font-size:10px;color:var(--dim);font-weight:400;text-align:left;padding-bottom:7px;border-bottom:1px solid var(--line)}
table.pr td{padding:6px 0;border-bottom:1px solid rgba(255,255,255,.045)}
table.pr tr:last-child td{border-bottom:0}
table.pr .rt{font-weight:600}
.rt-ssr{color:var(--ssr)}.rt-sr{color:var(--sr)}.rt-r{color:var(--r)}.rt-n{color:var(--n)}
table.pr .num{text-align:right;color:var(--muted)}
table.pr .num.hot{color:var(--gold-2);font-weight:600}

.pool{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.pool div{aspect-ratio:3/4;border-radius:5px;position:relative;overflow:hidden;border:1px solid var(--line)}
.pool div::after{content:"";position:absolute;inset:0;background:linear-gradient(150deg,rgba(255,255,255,.1),transparent 60%)}
.pool .b-ssr{background:linear-gradient(150deg,#6b4a18,#2a1d0d)}
.pool .b-sr{background:linear-gradient(150deg,#63346e,#241429)}
.pool .b-r{background:linear-gradient(150deg,#2f4f86,#131d31)}
.pool .b-n{background:linear-gradient(150deg,#3c5068,#161d26)}

.cta{
  position:absolute;left:0;right:0;bottom:0;padding:11px 14px 16px;
  background:linear-gradient(to top,var(--bg) 62%,transparent);z-index:5;
}
.btn{
  height:46px;border-radius:23px;display:flex;align-items:center;justify-content:center;gap:8px;
  font-size:15px;font-weight:600;letter-spacing:.5px;
  background:linear-gradient(100deg,#f5b544,#ffd479);color:#3a2600;
  box-shadow:0 8px 22px rgba(245,181,68,.22);
}
.btn .pr{font-size:13px;opacity:.75;font-weight:500}
.btn.ghost{background:transparent;border:1px solid var(--line);color:var(--muted);box-shadow:none}
.btn.sm{height:38px;font-size:13px;border-radius:19px}

.note{text-align:center;font-size:9.5px;color:var(--dim);margin-top:8px;line-height:1.5}

.mask{position:absolute;inset:0;background:radial-gradient(circle at 50% 42%,#241a06,#0b0d12 62%);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:20}
.glow{position:absolute;width:250px;height:250px;border-radius:50%;background:radial-gradient(circle,rgba(255,212,121,.28),transparent 66%)}
.pack{width:118px;height:158px;border-radius:10px;background:linear-gradient(150deg,#8a5f18,#3d2a0b);border:1px solid rgba(255,212,121,.4);position:relative;z-index:2;overflow:hidden}
.pack::before{content:"";position:absolute;inset:0;background:linear-gradient(115deg,rgba(255,255,255,.22) 0%,transparent 46%,rgba(255,255,255,.1) 100%)}
.pack::after{content:"";position:absolute;left:50%;top:50%;width:42px;height:42px;margin:-21px 0 0 -21px;border-radius:50%;border:2px solid rgba(255,212,121,.55)}
.mask h3{font-size:15px;font-weight:600;color:var(--gold-2);margin-top:22px;z-index:2;letter-spacing:1px}
.mask p{font-size:11px;color:rgba(255,228,173,.6);margin-top:7px;z-index:2}
.loader{width:126px;height:3px;border-radius:2px;background:rgba(255,255,255,.13);margin-top:20px;z-index:2;overflow:hidden}
.loader i{display:block;height:100%;width:64%;border-radius:2px;background:linear-gradient(90deg,var(--gold),var(--gold-2))}

.rslt{position:absolute;inset:0;background:radial-gradient(circle at 50% 32%,#2a1f08,#0b0d12 60%);display:flex;flex-direction:column;align-items:center;padding:0 20px;z-index:20}
.rslt .hdr{text-align:center;margin:22px 0 20px}
.rslt .hdr h3{font-size:17px;font-weight:600;color:var(--gold-2);letter-spacing:1px}
.rslt .hdr p{font-size:10.5px;color:rgba(255,228,173,.55);margin-top:6px}
.bigcard{width:158px;height:214px;border-radius:12px;background:linear-gradient(150deg,#8a5f18,#3d2a0b);border:2px solid rgba(255,212,121,.65);position:relative;box-shadow:0 0 42px rgba(255,212,121,.28);overflow:hidden}
.bigcard::after{content:"";position:absolute;inset:0;background:linear-gradient(115deg,rgba(255,255,255,.26) 0%,transparent 44%,rgba(255,255,255,.12) 100%)}
.bigcard .rl{position:absolute;top:9px;left:9px;font-size:9px;font-weight:700;letter-spacing:.6px;padding:2px 8px;border-radius:4px;background:linear-gradient(135deg,#ffd479,#e09b2d);color:#3a2600;z-index:2}
.bigcard .cn{position:absolute;left:0;right:0;bottom:12px;text-align:center;font-size:12px;font-weight:600;color:#ffe4ad;z-index:2}
.cname{font-size:14px;font-weight:600;margin-top:18px}
.cmeta{font-size:10.5px;color:var(--dim);margin-top:6px;text-align:center;line-height:1.6}
.cmeta b{color:var(--muted);font-weight:500}
.rslt .acts{display:flex;gap:10px;margin-top:24px;width:100%}
.rslt .acts .btn{flex:1}

.orow{background:var(--surface);border:1px solid var(--line);border-radius:11px;padding:12px 13px;margin-bottom:10px}
.orow .top{display:flex;justify-content:space-between;align-items:center;margin-bottom:9px}
.orow .no{font-size:10px;color:var(--dim);letter-spacing:.3px}
.st{font-size:10px;font-weight:600;padding:2.5px 9px;border-radius:999px}
.st.drawn{background:rgba(78,203,143,.14);color:#6fdda8}
.st.pending{background:rgba(245,181,68,.14);color:var(--gold-2)}
.st.failed{background:rgba(255,107,107,.14);color:#ff9d9d}
.orow .mid{display:flex;gap:7px;margin-bottom:10px}
.orow .mid .th{width:44px;aspect-ratio:3/4;border-radius:5px;position:relative;overflow:hidden;border:1px solid var(--line)}
.orow .mid .info{flex:1;min-width:0}
.orow .mid .bn{font-size:12px;font-weight:600;margin-bottom:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.orow .mid .su{font-size:10px;color:var(--dim)}
.orow .bot{display:flex;justify-content:space-between;align-items:baseline;padding-top:9px;border-top:1px solid var(--line)}
.orow .bot .lb{font-size:10px;color:var(--dim)}
.orow .bot .amt{font-size:15px;font-weight:700;color:var(--gold-2)}

.kv{display:flex;justify-content:space-between;font-size:11.5px;padding:8px 0;border-bottom:1px solid rgba(255,255,255,.045)}
.kv:last-child{border-bottom:0}
.kv .k{color:var(--dim)}
.kv .v{color:var(--text)}
.kv .v.gold{color:var(--gold-2);font-weight:600;font-size:14px}
.kv .v.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:10.5px}

.itemrow{display:flex;gap:10px;align-items:center;padding:9px 0;border-bottom:1px solid rgba(255,255,255,.045)}
.itemrow:last-child{border-bottom:0}
.itemrow .th{width:42px;aspect-ratio:3/4;border-radius:5px;position:relative;overflow:hidden;border:1px solid var(--line);flex:0 0 auto}
.itemrow .txt{flex:1;min-width:0}
.itemrow .txt .n{font-size:12px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.itemrow .txt .m{font-size:9.5px;color:var(--dim);margin-top:3px}

.login{position:absolute;inset:0;display:flex;flex-direction:column;padding:0 26px;justify-content:center;background:radial-gradient(circle at 50% 18%,#1d1706,#0b0d12 58%)}
.logo{width:66px;height:66px;border-radius:19px;background:linear-gradient(140deg,#f5b544,#c98a1c);margin:0 auto 16px;display:flex;align-items:center;justify-content:center;font-size:29px;font-weight:700;color:#3a2600;box-shadow:0 10px 26px rgba(245,181,68,.28)}
.login h2{font-size:19px;font-weight:600;text-align:center;letter-spacing:.5px}
.login .sub{font-size:11px;color:var(--dim);text-align:center;margin:8px 0 30px}
.field{background:var(--surface-2);border:1px solid var(--line);border-radius:10px;height:44px;display:flex;align-items:center;padding:0 14px;gap:10px;margin-bottom:11px;font-size:12.5px;color:var(--dim)}
.field.filled{color:var(--text)}
.field .cur{width:1.5px;height:16px;background:var(--gold);animation:blink 1.1s step-end infinite}
@keyframes blink{50%{opacity:0}}
.field .ico{width:14px;height:14px;border:1.5px solid var(--dim);border-radius:3px;flex:0 0 auto}
.field .ico.pw{border-radius:50% 50% 3px 3px}
.slider{background:var(--surface-2);border:1px solid var(--line);border-radius:10px;height:44px;display:flex;align-items:center;justify-content:space-between;padding:0 5px 0 14px;margin-bottom:20px;font-size:11.5px;color:var(--dim)}
.knob{width:34px;height:34px;border-radius:8px;background:linear-gradient(140deg,#f5b544,#d99a24);display:flex;align-items:center;justify-content:center;color:#3a2600;font-size:15px;font-weight:700}

.prof{background:linear-gradient(140deg,rgba(245,181,68,.14),rgba(245,181,68,.03));border:1px solid rgba(245,181,68,.2);border-radius:14px;padding:15px;margin:14px 0 12px;display:flex;align-items:center;gap:13px}
.prof .av2{width:50px;height:50px;border-radius:50%;background:linear-gradient(140deg,#f5b544,#c98a1c);display:flex;align-items:center;justify-content:center;font-size:19px;font-weight:700;color:#3a2600;flex:0 0 auto}
.prof .inf{flex:1;min-width:0}
.prof .inf .nk{font-size:14.5px;font-weight:600}
.prof .inf .un{font-size:10.5px;color:var(--dim);margin-top:4px}
.bal{background:var(--surface);border:1px solid var(--line);border-radius:11px;padding:13px 15px;display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}
.bal .l{font-size:10.5px;color:var(--dim)}
.bal .v{font-size:21px;font-weight:700;color:var(--gold-2);margin-top:5px;letter-spacing:-.3px}
.bal .rt{font-size:10.5px;padding:5px 13px;border-radius:999px;background:var(--gold-dim);color:var(--gold);border:1px solid rgba(245,181,68,.3)}
.menu{background:var(--surface);border:1px solid var(--line);border-radius:11px;overflow:hidden}
.menu a{display:flex;align-items:center;gap:11px;padding:13px 15px;border-bottom:1px solid rgba(255,255,255,.045);text-decoration:none;color:var(--text);font-size:12.5px}
.menu a:last-child{border-bottom:0}
.menu a .mi{width:16px;height:16px;border:1.5px solid var(--muted);border-radius:4px;flex:0 0 auto}
.menu a .t{flex:1}
.menu a .ar{width:7px;height:7px;border-right:1.5px solid var(--dim);border-top:1.5px solid var(--dim);transform:rotate(45deg)}
.empty{padding:40px 0;text-align:center;font-size:11.5px;color:var(--dim)}
.legend{max-width:1400px;margin:56px auto 0;padding-top:28px;border-top:1px solid var(--line)}
.legend h3{font-size:14px;font-weight:600;margin-bottom:14px}
.legend .items{display:flex;flex-wrap:wrap;gap:10px 26px;font-size:12px;color:var(--muted)}
.legend .it{display:flex;align-items:center;gap:8px}
.legend .sw{width:26px;height:26px;border-radius:6px;border:1px solid var(--line)}
