# Redis 缓存配置
#
# 设计（mall MVP 设计 D5 / D16 / Phase 10）：
#   - driver：选 Cache 实现。"redis" = 仅 Redis（兼容）；"multi" = L1 内存 + L2 Redis 双层（推荐）
#   - redis.*  : Redis 连接配置（driver=redis / multi 都要）
#   - memory.* : L1 内存缓存配置（仅 driver=multi 生效）
#   - ttl.*    : 各业务场景的 L1 / L2 TTL（业务代码读取）
#
# 字段说明：
#   - driver：固定 "redis"（MVP）→ Phase 10 起可切换 "multi"
#   - host / port / password / db：标准 Redis 连接
#   - pool_size：连接池上限，按并发量定
#
# TTL 字段语义：
#   - blindbox_detail.l1 / l2: 盲盒详情缓存 TTL
#   - home_feed.l1 / l2: 首页 feed 缓存 TTL
#   - draw_rate.l2: 抽卡限流 TTL（限流只走 L2 Redis，无 l1）

# 注意：外层 `cache:` 键必须存在。加载器（internal/infra/config）按文件名合并各
# config/*.yaml 后直接 Unmarshal，**不会**按文件名自动包壳；Config.Cache 的
# mapstructure 是 "cache"，缺了这层会让 cache.* 全部落到空值。
cache:
  # Cache 实现选择：redis（单层）/ multi（双层 L1 + L2）
  driver: redis

  # L2 Redis 连接配置（无论 driver 是 redis 还是 multi 都需要）
  redis:
    driver: redis
    host: 127.0.0.1
    port: 6379
    # 留空 —— 真值由 .env.yaml 的 cache.redis.password 提供（gitignored，本地覆盖）。
    password: ""
    # Redis 数据库编号（默认 0）
    db: 0
    # 连接池大小
    pool_size: 50

  # L1 进程内内存缓存配置（仅 driver=multi 生效）
  memory:
    # 每条数据默认过期时间（Set ttl=0 时走此值）
    default_ttl: 10s
    # 后台清扫 goroutine 间隔（<=0 关闭清扫）
    cleanup_interval: 60s
    # 容量上限（条目数）。当前 go-cache v2.1.0 未启用，保留字段
    max_size: 10000

  # 业务场景 TTL：业务代码读取本段决定每次 Set 传什么 TTL
  ttl:
    # 盲盒详情
    blindbox_detail:
      l1: 10s    # L1 内存 TTL：短，仅抗同进程瞬时并发
      l2: 10m    # L2 Redis TTL：长，跨进程共享
    # 首页 feed
    home_feed:
      l1: 5s     # L1 内存 TTL：更短，feed 变更频繁
      l2: 5m     # L2 Redis TTL：中等
    # 抽卡限流（仅 L2，限流必须全集群共享）
    draw_rate:
      l2: 60s    # 限流 key TTL
