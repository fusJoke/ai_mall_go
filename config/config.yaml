# HTTP 服务配置
server:
  name: ai-go-mall
  port: 8080
  # 运行模式：dev / release。默认 release；
  # dev 才会暴露 /swagger/*any（API 文档 + swagger UI）。
  mode: release
  # 内容分发网络 URL（末尾不带 `/`）。
  # 留空 → 不使用 CDN，FullURL 走当前请求域名。
  cdn_url: ""
  # 内容分发网络 URL 参数，将自动拼接到 cdn_url 结尾（值如 format/heif）。
  cdn_url_params: ""

# 数据库配置
database:
  # 数据库类型：mysql / postgres 等，默认 mysql
  # type 与 prefix 对写库与读库共享
  type: mysql
  # 全表前缀，例如 "mall_" 会让 GORM 自动给所有表加上前缀
  prefix: ""

  # 写库配置
  write:
    host: 127.0.0.1
    port: 3306
    username: root
    # 留空 —— 真值由 .env.yaml 的 database.write.password 提供（gitignored，本地覆盖）。
    # .env.yaml.example 标注了字段路径；CI / 生产侧必须自行注入凭据。
    password: ""
    dbname: ai-go-mall

    # 连接池配置
    max_open_conns: 100
    max_idle_conns: 10
    # 连接最大存活时间，使用 Go 标准 duration 格式，例如 "1h"、"30m"、"3600s"
    conn_max_lifetime: 1h
    # 连接最大空闲时间，使用 Go 标准 duration 格式
    conn_max_idle_time: 10m

  # 读副本配置（可选；enabled=false 时所有读请求也走写库）
  read:
    enabled: false
    host: 127.0.0.1
    port: 3307
    username: root
    # 留空 —— 同 write.password，由 .env.yaml 提供。
    password: ""
    dbname: ai-go-mall

    max_open_conns: 50
    max_idle_conns: 10
    conn_max_lifetime: 1h
    conn_max_idle_time: 10m

# token 配置
token:
  # 存储驱动：database（默认） / 后续可加 redis
  driver: database

# mall 业务配置
mall:
  # 平台默认手续费率（4 位小数，例 0.1000 = 10%）。
  # 生效场景：mall_suppliers.commission_rate IS NULL 时使用本值。
  # 注意：commission_rate 字段在结算单上是"快照"——生成结算单时
  # 取当时的 supplier.commission_rate 或本默认，落表不再追溯变更。
  default_commission_rate: 0.1000